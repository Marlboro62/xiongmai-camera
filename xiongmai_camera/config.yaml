name: "Caméra XiongMai"
version: "0.1.0-beta.5"
slug: "xiongmai_camera"
description: "Réglages des caméras IP XiongMai / XMEye sans ActiveX ni Internet Explorer"
url: "https://github.com/Marlboro62/xiongmai-camera"
stage: experimental
arch:
  - aarch64
  - amd64
init: false
ingress: true
homeassistant_api: true
panel_icon: mdi:cctv
panel_title: "Caméra XiongMai"
options:
  cameras: []
schema:
  cameras:
    - name: str
      host: str
      port: port
      username: str
      password: password
      http_port: port?
      snapshot_entity: str?
