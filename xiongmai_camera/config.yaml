name: "Caméra XiongMai"
version: "0.1.0"
slug: "xiongmai_camera"
description: "Réglages des caméras IP XiongMai / XMEye sans ActiveX ni Internet Explorer"
url: "https://github.com/Marlboro62/xiongmai-camera"
arch:
  - aarch64
  - amd64
init: false
ingress: true
homeassistant_api: true
services:
  - mqtt:want
panel_icon: mdi:cctv
panel_title: "Caméra XiongMai"
options:
  cameras: []
  mqtt: true
schema:
  cameras:
    - name: str
      host: str
      port: port
      username: str
      password: password
      http_port: port?
      snapshot_entity: str?
  mqtt: bool
  mqtt_host: str?
  mqtt_port: port?
  mqtt_username: str?
  mqtt_password: password?
  mqtt_tls: bool?
  mqtt_tls_insecure: bool?
