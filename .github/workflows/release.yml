name: Publication

# Quand la version de xiongmai_camera/config.yaml change sur main, crée l'étiquette vX.Y.Z et la publication GitHub.
# Notes : .github/release-notes/vX.Y.Z.md, sinon la section du journal des changements. Un tiret (-beta) = pré-version.
on:
  push:
    branches: [main]
    paths: ["xiongmai_camera/config.yaml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Créer la publication
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="$(sed -n 's/^version: *"\{0,1\}\([^"]*\)"\{0,1\}$/\1/p' xiongmai_camera/config.yaml)"
          TAG="v${VERSION}"
          if gh release view "$TAG" >/dev/null 2>&1; then echo "$TAG existe déjà"; exit 0; fi
          NOTES=".github/release-notes/${TAG}.md"
          if [ ! -f "$NOTES" ]; then
            NOTES="$(mktemp)"
            awk -v v="## ${VERSION}" 'index($0, v) == 1 {on=1; next} /^## / && on {exit} on' xiongmai_camera/CHANGELOG.md > "$NOTES"
          fi
          FLAGS=""
          case "$VERSION" in *-*) FLAGS="--prerelease" ;; esac
          gh release create "$TAG" --target "$GITHUB_SHA" --title "Caméra XiongMai ${VERSION}" --notes-file "$NOTES" $FLAGS
